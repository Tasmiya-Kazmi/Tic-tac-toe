<!DOCTYPE html>
<html>
<head>
  <title>Welcome</title>
  <style>
    body {
      background-color: #f5f0e6;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      color: #4b2e2e;
      margin-top: 100px;
    }
    h1 {
      font-size: 2.5em;
      color: #6b4226;
      text-shadow: 2px 2px #e6d5c3;
    }
    button {
      margin: 20px;
      padding: 12px 25px;
      background-color: #6b4226;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.2em;
      box-shadow: 0 4px 10px rgba(75, 46, 46, 0.3);
    }
    button:hover {
      background-color: #8c5a3c;
    }
  </style>
</head>
<body>
  <h1>Hello beautiful people</h1>
  <p>Do you wanna criss‑cross today?</p>

  <!-- Yes button goes to Tic Tac Toe -->
  <button onclick="location.href='index.html'">Yes</button>

  <!-- No button does nothing -->
  <button onclick="alert('Okay, maybe later!')">No</button>
</body>
</html>
